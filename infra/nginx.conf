map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $uri $safe_request_path {
    ~^/display/[^/]+ /display/[redacted];
    ~^/api/v1/display/[^/]+/snapshot /api/v1/display/[redacted]/snapshot;
    default $uri;
}
log_format multigame '$remote_addr $request_method $safe_request_path $status $body_bytes_sent $request_time';
access_log /var/log/nginx/access.log multigame;
upstream multigame_web { server web:3000; }
upstream multigame_game { server game:4001; }
server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # Current Next hydration requires inline bootstrap. Tighten to per-request
    # nonces before public launch; do not silently permit arbitrary third parties.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location /socket.io/ {
        proxy_pass http://multigame_game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
    location ~ ^/(api/(v1|auth)/|health/) {
        proxy_pass http://multigame_game;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://multigame_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection '';
    }
}
