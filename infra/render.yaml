# Evaluation only. Creation still requires a confirmed Render workspace and
# repository connection. Free service/database restrictions are in HOSTING.md.
# Validate with the official schema / Render CLI before Blueprint synchronization.
previews:
  generation: 'off'
databases:
  - name: multigame-evaluation-db
    databaseName: multigame
    user: multigame
    plan: free
    region: frankfurt
    postgresMajorVersion: '17'
    ipAllowList: []
services:
  - type: web
    name: multigame-evaluation-game
    runtime: node
    plan: free
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: checksPass
    buildCommand: npm install --global pnpm@11.25.0 && pnpm install --frozen-lockfile && pnpm exec tsc --noEmit
    startCommand: node --import tsx apps/game-service/src/server.ts
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: AUTO_MIGRATE
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: multigame-evaluation-db
          property: connectionString
      - key: PUBLIC_ORIGIN
        sync: false
      - key: PIN_PEPPER
        generateValue: true
      - key: AUTH_BOOTSTRAP_EMAIL
        sync: false
      - key: AUTH_BOOTSTRAP_PASSWORD
        sync: false
      - key: MAX_PLAYERS
        value: '25'
