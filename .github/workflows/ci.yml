name: verify
'on':
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_USER: multigame
          POSTGRES_DB: multigame_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multigame -d multigame_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - name: Domain, persistence and authorization
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://multigame:ci_only_password@localhost:5432/multigame_test
      - name: Real HTTP and Socket.IO lifecycle
        run: node --import tsx --test tests/e2e/*.test.ts
      - name: Build self-hosted Next application
        run: pnpm --dir apps/web build
      - name: Dependency advisories
        run: pnpm audit --prod --audit-level high
      - name: Record verification outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: tests/reports/
          if-no-files-found: ignore
